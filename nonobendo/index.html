<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Projets</title>
<style>
  :root { --orange: #ff5a00; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    color: #fff;
    font-family: system-ui, "Segoe UI", sans-serif;
    background: #000;
  }
  .stage {
    position: relative;
    min-height: 100vh;
    min-height: 100dvh;
    overflow: hidden;
    background:
      radial-gradient(820px 480px at 92% -8%, rgba(255, 90, 0, .62), transparent 58%),
      radial-gradient(640px 420px at -12% 108%, rgba(255, 255, 255, .2), transparent 56%),
      radial-gradient(420px 320px at 48% 118%, rgba(255, 90, 0, .22), transparent 60%),
      linear-gradient(165deg, #1a1a1a 0%, #050505 38%, #000 100%);
  }
  .stage::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(255, 255, 255, .045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, .045) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(ellipse at 70% 0%, #000 10%, transparent 68%);
  }
  main {
    position: relative;
    z-index: 1;
    max-width: 980px;
    margin: 0 auto;
    padding: max(64px, env(safe-area-inset-top)) 28px 56px;
  }
  .eyebrow {
    color: #ff8a3d;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .28em;
    text-transform: uppercase;
  }
  h1 {
    margin-top: 12px;
    font-size: clamp(64px, 11vw, 112px);
    line-height: .86;
    letter-spacing: -.06em;
    font-weight: 750;
    background: linear-gradient(115deg, #fff 8%, #fff 38%, #ffd0b4 68%, var(--orange) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .lead {
    margin-top: 18px;
    max-width: 26rem;
    color: rgba(255, 255, 255, .74);
    font-size: 16px;
    line-height: 1.5;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 360px));
    gap: 16px;
    margin-top: 52px;
  }
  .card {
    position: relative;
    appearance: none;
    text-align: left;
    cursor: pointer;
    color: #fff;
    min-height: 188px;
    padding: 22px 22px 20px;
    border-radius: 22px;
    border: 1px solid transparent;
    background:
      radial-gradient(120% 90% at 0% 0%, rgba(255, 255, 255, .16), transparent 46%) padding-box,
      linear-gradient(165deg, #1c1c1c, #070707) padding-box,
      linear-gradient(140deg, #fff, rgba(255, 90, 0, .35) 42%, var(--orange)) border-box;
    box-shadow: 0 18px 50px rgba(0, 0, 0, .45), 0 0 40px rgba(255, 90, 0, .08);
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .card:hover, .card:focus-visible {
    transform: translateY(-4px);
    box-shadow: 0 22px 54px rgba(255, 90, 0, .22);
    outline: none;
  }
  .kicker {
    display: block;
    color: #ffb088;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .18em;
  }
  .card strong {
    display: block;
    margin-top: 22px;
    font-size: 30px;
    letter-spacing: -.04em;
    line-height: 1;
  }
  .desc {
    display: block;
    margin-top: 10px;
    max-width: 22ch;
    color: rgba(255, 255, 255, .7);
    font-size: 14px;
    line-height: 1.45;
  }
  .go {
    position: absolute;
    right: 16px;
    bottom: 16px;
    width: 38px;
    height: 38px;
    border-radius: 999px;
    display: grid;
    place-items: center;
    background: linear-gradient(140deg, #fff 0%, #ffe1d0 42%, var(--orange) 100%);
    color: #111;
    font-size: 18px;
    line-height: 1;
  }
  @media (max-width: 640px) {
    main { padding-left: 18px; padding-right: 18px; }
    .card { min-height: 164px; }
    .card strong { font-size: 26px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card { transition: none; }
    .card:hover { transform: none; }
  }
</style>
</head>
<body>
<div class="stage">
  <main>
    <p class="eyebrow">Nathan</p>
    <h1>Projets</h1>
    <p class="lead">Choisis un projet.</p>
    <div class="grid" id="tabs"></div>
  </main>
</div>
<script>
/** Ajoute un objet ici pour afficher un nouveau projet. */
const PROJECTS = [
  {
    name: 'Nonobendo',
    text: 'Suivi des candidatures alternance',
    href: 'suivi.html'
  }
];

const tabs = document.getElementById('tabs');
PROJECTS.forEach((project, index) => {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'card';
  const kicker = document.createElement('span');
  kicker.className = 'kicker';
  kicker.textContent = String(index + 1).padStart(2, '0');
  const title = document.createElement('strong');
  title.textContent = project.name;
  const text = document.createElement('span');
  text.className = 'desc';
  text.textContent = project.text;
  const go = document.createElement('span');
  go.className = 'go';
  go.setAttribute('aria-hidden', 'true');
  go.textContent = '→';
  btn.append(kicker, title, text, go);
  btn.addEventListener('click', () => {
    location.assign(project.href);
  });
  tabs.appendChild(btn);
});
</script>
</body>
</html>
