<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>
<style>
  html, body { margin: 0; background: #fff; min-height: 100%; }
</style>
</head>
<body>
<script>
(async function () {
  function fromB64(s) {
    s = String(s || '').replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    try { return decodeURIComponent(escape(atob(s))); } catch (e) { return ''; }
  }

  function unpackCompact(packed) {
    try {
      var parts = fromB64(packed).split('\t');
      if (parts.length < 3) return null;
      var store = parts[0];
      if (store.indexOf('nb-') !== 0) store = 'nb-' + store;
      var cid = parts[1] || '';
      if (cid.charAt(0) === '*') cid = 'custom_' + cid.slice(1);
      var dest = parts[2] || '';
      if (dest.charAt(0) === '@') dest = 'http://' + dest.slice(1);
      else if (!/^https?:\/\//i.test(dest)) dest = 'https://' + dest;
      return { store: store, cid: cid, dest: dest };
    } catch (e) { return null; }
  }

  async function loadTokenMap(token) {
    try {
      var local = localStorage.getItem('nbl_' + token);
      if (local) {
        var j = JSON.parse(local);
        if (j && j.u) return j;
      }
    } catch (e) {}
    try {
      var res = await Promise.race([
        fetch('https://ntfy.sh/nbl-' + encodeURIComponent(token) + '/json?poll=1&since=all'),
        new Promise(function (_, rej) { setTimeout(function () { rej(new Error('t')); }, 2500); })
      ]);
      if (!res.ok) return null;
      var text = await res.text();
      var lines = text.split('\n').filter(Boolean);
      for (var i = lines.length - 1; i >= 0; i--) {
        try {
          var msg = JSON.parse(lines[i]);
          if (msg.event !== 'message') continue;
          var data = JSON.parse(msg.message);
          if (data && data.u) return data;
        } catch (e2) {}
      }
    } catch (e3) {}
    return null;
  }

  var q = new URLSearchParams(location.search);
  var store = '', cid = '', dest = '';

  // Format court : ?r=token
  var token = q.get('r');
  if (token) {
    var map = await loadTokenMap(token);
    if (map) {
      store = map.s || '';
      cid = String(map.c || '');
      dest = map.u || '';
    }
  }

  // Format compact autonome : ?d=...
  if (!dest && q.get('d')) {
    var packed = unpackCompact(q.get('d'));
    if (packed) {
      store = packed.store;
      cid = packed.cid;
      dest = packed.dest;
    }
  }

  // Ancien format #base64
  if (!dest) {
    var raw = (location.hash || '').replace(/^#/, '');
    if (raw) {
      try {
        var parsed = JSON.parse(fromB64(raw));
        if (Array.isArray(parsed)) {
          store = parsed[0] || '';
          cid = String(parsed[1] || '');
          dest = parsed[2] || '';
        } else if (parsed && typeof parsed === 'object') {
          store = parsed.s || '';
          cid = String(parsed.c || '');
          dest = parsed.u || '';
        }
      } catch (e4) {}
    }
  }

  // Très ancien : ?s=&c=&u=
  if (!dest) {
    store = store || q.get('s') || '';
    cid = cid || q.get('c') || '';
    dest = q.get('u') || '';
    try { dest = decodeURIComponent(dest); } catch (e5) {}
  }

  if (!dest) {
    document.body.textContent = 'Lien invalide ou expiré.';
    return;
  }
  if (!/^https?:\/\//i.test(dest)) dest = 'https://' + dest;

  var now = new Date().toISOString();
  try {
    if (store && cid) {
      try {
        var key = 'nonobendo_clicks_' + store;
        var localC = JSON.parse(localStorage.getItem(key) || '{}');
        var prev = localC[cid] || { n: 0 };
        localC[cid] = { n: (prev.n || 0) + 1, last: now, t: dest };
        localStorage.setItem(key, JSON.stringify(localC));
      } catch (e6) {}

      if (String(store).indexOf('nb-') === 0) {
        try {
          await Promise.race([
            fetch('https://ntfy.sh/' + encodeURIComponent(store), {
              method: 'POST',
              headers: { Title: 'c', 'Content-Type': 'text/plain' },
              body: JSON.stringify({ c: String(cid), last: now })
            }),
            new Promise(function (r) { setTimeout(r, 1500); })
          ]);
        } catch (e7) {}
      }
    }
  } catch (e8) {}

  location.replace(dest);
})();
</script>
</body>
</html>
